<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="500" height="400" fill="transparent"/>
  
  <!-- Floating decorative circles -->
  <circle cx="100" cy="100" r="40" fill="url(#grad1)" opacity="0.1" />
  <circle cx="400" cy="300" r="60" fill="url(#grad1)" opacity="0.05" />
  <circle cx="450" cy="80" r="30" fill="#EC4899" opacity="0.1" />
  
  <!-- Large 404 Text -->
  <text x="50%" y="220" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="900" fill="url(#grad1)" filter="url(#shadow)">404</text>
  
  <!-- Modern "Broken" elements -->
  <path d="M180 280 H320" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" opacity="0.2" />
  <rect x="220" y="275" width="60" height="8" rx="4" fill="url(#grad1)" />
  
  <!-- Small floating squares -->
  <rect x="80" y="280" width="15" height="15" rx="3" fill="#6366F1" opacity="0.4" transform="rotate(15 80 280)" />
  <rect x="420" y="150" width="10" height="10" rx="2" fill="#A855F7" opacity="0.4" transform="rotate(-20 420 150)" />
</svg>
