<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang ngoại tuyến | NHers Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Be+Vietnam+Pro', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        svg {
            width: 80px;
            height: 80px;
            color: #4f46e5;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-3.536 5 5 0 011.414-3.536m0 0L4.243 4.243M9.879 11.293a1 1 0 011.415 0 1 1 0 010 1.414l-1.415-1.414zm-7.071-7.071l1.414-1.414L21 21l-1.414 1.414L2.808 4.222z"></path>
        </svg>
        <h1>Bạn đang ngoại tuyến</h1>
        <p>Có vẻ như kết nối mạng của bạn đã bị gián đoạn. Vui lòng kiểm tra lại kết nối để sử dụng đầy đủ các tính năng của NHers.</p>
        <button onclick="window.location.reload()">Thử lại</button>
    </div>
</body>
</html>
